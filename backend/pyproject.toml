[tool.ruff]
target-version = "py311"
line-length = 100
src = ["apps", "config"]
extend-exclude = ["**/migrations/**"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = [
  "E501",  # line length handled separately; serializers are often long
  "UP038",  # isinstance X | Y — keep tuple form for readability
]

[tool.ruff.lint.per-file-ignores]
"apps/**/tests*.py" = ["B011"]
"config/settings.py" = ["E402"]

[tool.bandit]
exclude_dirs = ["**/migrations/**", "**/tests.py", "**/tests_*.py"]
skips = ["B101"]
