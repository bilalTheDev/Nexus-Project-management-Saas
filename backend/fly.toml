# fly.toml app configuration file generated for nexus-project-management-saas on 2026-10-29T10:57:17Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'nexus-project-management-saas'
primary_region = 'sin'
console_command = '/code/manage.py shell'

[build]

[deploy]
  release_command = 'python manage.py migrate --noinput'

[env]
  PORT = '8000'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'

[[statics]]
  guest_path = '/code/static'
  url_prefix = '/static/'
