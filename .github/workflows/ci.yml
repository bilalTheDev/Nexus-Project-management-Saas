name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  frontend:
    name: Frontend lint, build, audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: Fail on secret-like strings in dist
        run: npm run check:dist-secrets
      - name: npm audit (high+, production deps)
        run: npm audit --omit=dev --audit-level=high

  backend:
    name: Backend lint, security, tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # Ephemeral SQLite only — never depend on Neon credentials in CI.
      DJANGO_SECRET_KEY: ci-only-django-secret-key-at-least-fifty-characters-long!!
      DJANGO_DEBUG: "True"
      DATABASE_URL: ""
      DATABASE_URL_UNPOOLED: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      # Full-repo format not yet clean; enforce on config/ (Parts D/E) + syntax-critical apps rules.
      - name: Ruff check (config + critical apps)
        run: |
          ruff check config
          ruff check apps --select E9,F63,F7,F82
      - name: Ruff format --check (config)
        run: ruff format --check config
      - name: Bandit
        # Use pyproject.toml skips (B101 assert in templates, B105 demo seed passwords).
        run: bandit -r apps config -x '**/migrations/**,**/tests.py,**/tests_*.py' -q -c pyproject.toml
      - name: pip-audit
        run: pip-audit -r requirements.txt
      - name: Django system check
        run: python manage.py check
      - name: Django deploy check (prod-like env)
        env:
          DJANGO_DEBUG: "False"
          DJANGO_SECRET_KEY: ci-only-django-secret-key-at-least-fifty-characters-long!!
          DJANGO_ALLOWED_HOSTS: ci.example.com
          # Keep SSL redirect on for deploy checks; CI does not serve HTTP.
          SECURE_SSL_REDIRECT: "True"
          CORS_ALLOWED_ORIGINS: https://app.example.com
          CSRF_TRUSTED_ORIGINS: https://app.example.com
        run: python manage.py check --deploy
      - name: Ensure model changes have migrations
        run: python manage.py makemigrations --check --dry-run
      - name: Apply migrations (SQLite in CI)
        run: python manage.py migrate --noinput
      - name: Run backend tests
        run: python manage.py test --verbosity=1
      - name: OpenAPI schema drift (informational)
        continue-on-error: true
        run: python scripts/check_schema_drift.py
