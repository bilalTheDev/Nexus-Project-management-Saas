name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    name: Frontend lint & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # Ephemeral SQLite only — never depend on Neon credentials in CI.
      DJANGO_SECRET_KEY: ci-only-django-secret-key-not-for-production-use
      DJANGO_DEBUG: "True"
      DATABASE_URL: ""
      DATABASE_URL_UNPOOLED: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Django system check
        run: python manage.py check
      - name: Ensure model changes have migrations
        run: python manage.py makemigrations --check --dry-run
      - name: Apply migrations (SQLite in CI)
        run: python manage.py migrate --noinput
      - name: Run backend tests
        run: python manage.py test --verbosity=1
